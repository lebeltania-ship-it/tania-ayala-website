<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3A1814">
  <title>¡Gracias por tu compra! | Tania Ayala Body Sculpting</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ivory:#FBF5F3; --linen:#E4BEB8; --dark:#3A1814; --mid:#5C3430; --light:#9A7068; --gold:#C9A84C; --gold-dk:#8B6914; --wa:#25D366; --wa-ink:#08341a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--ivory); color: var(--dark); font-family: 'Montserrat', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .card { width: min(460px, 100%); background: #fff; border-top: 3px solid var(--gold); padding: 2.2rem 1.6rem 1.8rem; box-shadow: 0 18px 50px rgba(58,24,20,.12); text-align: center; }
    .logo { height: 64px; margin: 0 auto 1.2rem; display: block; }
    .check { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 50%; background: var(--dark); color: #fff; display: grid; place-items: center; font-size: 1.6rem; }
    .eyebrow { font-size: .64rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-dk); }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 2.1rem; line-height: 1.15; margin: .35rem 0 .8rem; text-wrap: balance; }
    .lead { font-size: .86rem; line-height: 1.7; color: var(--mid); }
    .order { margin: 1.4rem 0; border-top: 1px solid var(--linen); border-bottom: 1px solid var(--linen); padding: .7rem 0; text-align: left; }
    .order div { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; }
    .order dt { font-size: .76rem; color: var(--light); }
    .order dd { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2rem; text-align: right; }
    .btn { display: flex; align-items: center; justify-content: center; gap: .55rem; min-height: 3.2rem; padding: .8rem 1.2rem; font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
    .btn-wa { background: var(--wa); color: var(--wa-ink); }
    .btn-home { margin-top: .6rem; background: transparent; color: var(--mid); font-weight: 600; }
    .note { font-size: .74rem; color: var(--light); margin-top: .9rem; line-height: 1.6; }
    .lang { position: fixed; top: 12px; right: 12px; display: flex; gap: 2px; }
    .lang button { font: inherit; font-size: .66rem; font-weight: 700; padding: .4rem .6rem; border: 1px solid var(--linen); background: #fff; color: var(--light); cursor: pointer; }
    .lang button[aria-pressed="true"] { color: var(--dark); border-color: var(--dark); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="lang"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
  <main class="card">
    <img class="logo" src="images/logo-tania-gold.png" alt="Tania Ayala Body Sculpting">
    <div class="check" aria-hidden="true">&#10003;</div>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <dl class="order" id="order" hidden>
      <div><dt data-t="item"></dt><dd id="oItem"></dd></div>
      <div id="rowSize"><dt data-t="size"></dt><dd id="oSize"></dd></div>
      <div id="rowPrice"><dt data-t="price"></dt><dd id="oPrice"></dd></div>
    </dl>
    <a class="btn btn-wa" id="wa" target="_self"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.4 1.8 2.2 1.2 1.1 2.2 1.4 2.5 1.5.3.2.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.8-.1 1.4z"/></svg><span data-t="wa"></span></a>
    <p class="note" data-t="note"></p>
    <a class="btn btn-home" href="index.html#shop" data-t="home"></a>
  </main>
  <script>
    var T = {
      es: { eyebrow: 'Pago recibido', h1: '¡Gracias por tu compra!', lead: 'Tu pedido fue recibido. Envíale tu pedido a Tania por WhatsApp para confirmar tu talla y el envío.', item: 'Producto', size: 'Talla', price: 'Total · envío incluido', wa: 'Enviar mi pedido por WhatsApp', note: 'WhatsApp se abre con tu pedido ya escrito — solo toca Enviar.', home: 'Volver a la tienda' },
      en: { eyebrow: 'Payment received', h1: 'Thank you for your order!', lead: 'Your order was received. Send it to Tania on WhatsApp to confirm your size and shipping.', item: 'Item', size: 'Size', price: 'Total · shipping included', wa: 'Send my order on WhatsApp', note: 'WhatsApp opens with your order already written — just tap Send.', home: 'Back to the shop' }
    };
    var q = new URLSearchParams(location.search);
    var item = (q.get('p') || '').slice(0, 60), size = (q.get('t') || '').slice(0, 6), price = (q.get('m') || '').replace(/[^0-9.]/g, '');
    var orderNo = (q.get('orderId') || q.get('transactionId') || '').slice(0, 40);
    var msg = 'Hola Tania! Acabo de comprar por la página web:\n' +
      (item ? '• ' + item + (size ? ' — Talla ' + size : '') + (price ? ' ($' + price + ')' : '') + '\n' : '') +
      (orderNo ? '• Pedido #' + orderNo + '\n' : '') + 'Mi nombre es: ';
    var waUrl = 'https://wa.me/16197301320?text=' + encodeURIComponent(msg);
    document.getElementById('wa').href = waUrl;
    if (item) {
      document.getElementById('order').hidden = false;
      document.getElementById('oItem').textContent = item;
      document.getElementById('oSize').textContent = size; document.getElementById('rowSize').hidden = !size;
      document.getElementById('oPrice').textContent = '$' + price; document.getElementById('rowPrice').hidden = !price;
    }
    function setLang(l) {
      document.documentElement.lang = l;
      document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = T[l][n.dataset.t]; });
      document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
      try { localStorage.setItem('lang', l); } catch (e) {}
    }
    var saved = 'es'; try { if (localStorage.getItem('lang') === 'en') saved = 'en'; } catch (e) {}
    setLang(saved);
    document.querySelectorAll('.lang button').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });
    // Open WhatsApp automatically once, right after checkout; the button stays for a second try.
    var key = 'wa-sent-' + (orderNo || item + size);
    var done = false; try { done = sessionStorage.getItem(key) === '1'; sessionStorage.setItem(key, '1'); } catch (e) {}
    if (item && !done) setTimeout(function () { location.href = waUrl; }, 1800);
  </script>
</body>
</html>
